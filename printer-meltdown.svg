<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
<title id="t">Blank Evens: the printer tantrum</title><desc id="d">A furious laser printer spits a curly document like a potato chip while a tiny dog escapes with a suitcase. A blank sheet saves the day.</desc>
